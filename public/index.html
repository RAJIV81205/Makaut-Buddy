<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makaut Buddy - Batch Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .type-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .type-btn.active {
            background: #667eea;
            color: white;
        }

        .type-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .link-input-area {
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-item .file-info {
            flex: 1;
            color: #333;
            word-break: break-all;
        }

        .file-item .file-number {
            font-weight: 600;
            color: #667eea;
            margin-right: 10px;
        }

        .file-item .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .file-item .remove-btn:hover {
            background: #cc0000;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .upload-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            display: block;
        }

        .result h3 {
            margin-bottom: 10px;
        }

        .result-item {
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .result-item.success {
            background: #c3e6cb;
        }

        .result-item.error {
            background: #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .parse-btn {
            background: #667eea;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Makaut Buddy</h1>
        <p class="subtitle">Google Drive Link Upload System</p>

        <div class="upload-type-selector">
            <button class="type-btn active" data-type="note">📚 Upload Notes</button>
            <button class="type-btn" data-type="pyq">📝 Upload PYQs</button>
        </div>

        <form id="uploadForm">
            <div class="form-group">
                <label for="branch">Branch</label>
                <select id="branch" name="branch" required>
                    <option value="">Select Branch</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="">Select Semester</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Select Subject</option>
                </select>
            </div>

            <div class="form-group hidden" id="yearGroup">
                <label for="year">Year</label>
                <input type="text" id="year" name="year" placeholder="e.g., 2023">
            </div>

            <div class="link-input-area">
                <label for="linkInput">📎 Paste Google Drive Links</label>
                <p class="hint">Enter one link per line. Filenames will be auto-generated from subject and year.</p>
                <p class="hint">Example:</p>
                <p class="hint">https://drive.google.com/file/d/ABC123.../view</p>
                <p class="hint">https://drive.google.com/file/d/XYZ789.../view</p>
                <textarea id="linkInput" placeholder="https://drive.google.com/file/d/ABC123.../view
https://drive.google.com/file/d/XYZ789.../view
https://drive.google.com/file/d/DEF456.../view"></textarea>
                <button type="button" class="upload-btn parse-btn" id="parseBtn">Parse Links</button>
            </div>

            <div class="file-list" id="fileList"></div>

            <button type="submit" class="upload-btn" id="uploadBtn" disabled>
                🚀 Upload Links to Database
            </button>

            <div class="result" id="result"></div>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let uploadType = 'note';
        let parsedLinks = [];

        // Initialize
        async function init() {
            await loadBranches();
            await loadSemesters();
            setupEventListeners();
        }

        // Load branches
        async function loadBranches() {
            try {
                const res = await fetch(`${API_BASE}/api/branches`);
                const data = await res.json();
                const select = document.getElementById('branch');
                data.branches.forEach(branch => {
                    const option = document.createElement('option');
                    option.value = branch;
                    option.textContent = branch;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading branches:', error);
            }
        }

        // Load semesters
        async function loadSemesters() {
            try {
                const res = await fetch(`${API_BASE}/api/semesters`);
                const data = await res.json();
                const select = document.getElementById('semester');
                data.semesters.forEach(sem => {
                    const option = document.createElement('option');
                    option.value = sem;
                    option.textContent = `Semester ${sem}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading semesters:', error);
            }
        }

        // Load subjects when semester changes
        document.getElementById('semester').addEventListener('change', async (e) => {
            const semester = e.target.value;
            if (!semester) return;

            try {
                const res = await fetch(`${API_BASE}/api/subjects?semester=${semester}`);
                const data = await res.json();
                const select = document.getElementById('subject');
                select.innerHTML = '<option value="">Select Subject</option>';
                data.subjects.forEach(subject => {
                    const option = document.createElement('option');
                    option.value = subject;
                    option.textContent = subject.replace(/_/g, ' ');
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading subjects:', error);
            }
        });

        // Setup event listeners
        function setupEventListeners() {
            // Upload type selector
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    uploadType = e.target.dataset.type;
                    document.getElementById('yearGroup').classList.toggle('hidden', uploadType === 'note');
                    document.getElementById('year').required = uploadType === 'pyq';
                    document.getElementById('result').style.display = 'none';
                });
            });

            // Parse button
            document.getElementById('parseBtn').addEventListener('click', parseLinks);

            // Form submit
            document.getElementById('uploadForm').addEventListener('submit', handleSubmit);
        }

        // Extract Google Drive file ID and convert to direct download link
        function convertToDriveDirectLink(link) {
            const regex = /\/d\/([a-zA-Z0-9_-]+)/;
            const match = link.match(regex);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return link;
        }

        // Parse links from textarea
        function parseLinks() {
            const input = document.getElementById('linkInput').value.trim();
            if (!input) {
                alert('Please enter some links first!');
                return;
            }

            const lines = input.split('\n').filter(line => line.trim());
            parsedLinks = [];

            lines.forEach((line) => {
                const trimmedLink = line.trim();
                if (trimmedLink.includes('drive.google.com')) {
                    const directLink = convertToDriveDirectLink(trimmedLink);
                    parsedLinks.push(directLink);
                }
            });

            if (parsedLinks.length === 0) {
                alert('No valid Google Drive links found!');
                return;
            }

            updateFileList();
            updateUploadButton();
            document.getElementById('result').style.display = 'none';
        }

        // Remove link
        function removeLink(index) {
            parsedLinks.splice(index, 1);
            updateFileList();
            updateUploadButton();
        }

        // Update file list display
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            if (parsedLinks.length === 0) {
                return;
            }

            const subject = document.getElementById('subject').value || 'Subject';
            const year = document.getElementById('year').value || 'Year';

            parsedLinks.forEach((link, index) => {
                const fileName = uploadType === 'note' 
                    ? `${subject}_Note_${index + 1}`
                    : `${subject}_${year}_PYQ_${index + 1}`;

                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <span class="file-number">#${index + 1}</span>
                        <strong>${fileName}</strong>
                        <br><small style="color: #666;">${link}</small>
                    </div>
                    <button type="button" class="remove-btn" onclick="removeLink(${index})">Remove</button>
                `;
                fileList.appendChild(item);
            });
        }

        // Update upload button state
        function updateUploadButton() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = parsedLinks.length === 0;
        }

        // Handle form submit
        async function handleSubmit(e) {
            e.preventDefault();

            const payload = {
                branch: document.getElementById('branch').value,
                semester: document.getElementById('semester').value,
                subject: document.getElementById('subject').value,
                links: parsedLinks
            };

            if (uploadType === 'pyq') {
                payload.year = document.getElementById('year').value;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            const result = document.getElementById('result');

            uploadBtn.disabled = true;
            result.style.display = 'none';

            try {
                const endpoint = uploadType === 'note' ? '/api/upload/notes' : '/api/upload/pyqs';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    let resultHTML = `
                        <h3>✅ Upload Complete!</h3>
                        <p><strong>Total:</strong> ${data.total} files</p>
                        <p><strong>Successful:</strong> ${data.successful}</p>
                        ${data.failed > 0 ? `<p><strong>Failed:</strong> ${data.failed}</p>` : ''}
                    `;

                    if (data.results && data.results.length > 0) {
                        resultHTML += '<div style="margin-top: 15px;">';
                        data.results.forEach(r => {
                            resultHTML += `
                                <div class="result-item ${r.success ? 'success' : 'error'}">
                                    ${r.success ? '✅' : '❌'} ${r.fileName}
                                    ${r.error ? `<br><small>Error: ${r.error}</small>` : ''}
                                </div>
                            `;
                        });
                        resultHTML += '</div>';
                    }

                    result.innerHTML = resultHTML;
                    result.className = 'result success';

                    // Clear after successful upload
                    setTimeout(() => {
                        parsedLinks = [];
                        updateFileList();
                        updateUploadButton();
                        document.getElementById('linkInput').value = '';
                        document.getElementById('uploadForm').reset();
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                result.innerHTML = `<h3>❌ Upload Failed</h3><p>${error.message}</p>`;
                result.className = 'result error';
            } finally {
                uploadBtn.disabled = false;
            }
        }

        // Make removeLink available globally
        window.removeLink = removeLink;

        // Initialize on load
        init();
    </script>
</body>
</html>
