<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makaut Buddy - Batch Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .type-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .type-btn.active {
            background: #667eea;
            color: white;
        }

        .type-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .file-drop-zone:hover, .file-drop-zone.dragover {
            background: #eef0ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .file-drop-zone p {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .file-drop-zone small {
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-item .file-name {
            flex: 1;
            color: #333;
        }

        .file-item .file-size {
            color: #666;
            margin-right: 15px;
        }

        .file-item .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .file-item .remove-btn:hover {
            background: #cc0000;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .upload-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            display: block;
        }

        .result h3 {
            margin-bottom: 10px;
        }

        .result-item {
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .result-item.success {
            background: #c3e6cb;
        }

        .result-item.error {
            background: #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Makaut Buddy</h1>
        <p class="subtitle">Batch File Upload System</p>

        <div class="upload-type-selector">
            <button class="type-btn active" data-type="note">📚 Upload Notes</button>
            <button class="type-btn" data-type="pyq">📝 Upload PYQs</button>
        </div>

        <form id="uploadForm">
            <div class="form-group">
                <label for="branch">Branch</label>
                <select id="branch" name="branch" required>
                    <option value="">Select Branch</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="">Select Semester</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Select Subject</option>
                </select>
            </div>

            <div class="form-group hidden" id="yearGroup">
                <label for="year">Year</label>
                <input type="text" id="year" name="year" placeholder="e.g., 2023" required>
            </div>

            <div class="file-drop-zone" id="dropZone">
                <p>📎 Drag & Drop Files Here</p>
                <small>or click to select files</small>
                <input type="file" id="fileInput" multiple accept=".pdf">
            </div>

            <div class="file-list" id="fileList"></div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>

            <button type="submit" class="upload-btn" id="uploadBtn" disabled>
                🚀 Upload Files
            </button>

            <div class="result" id="result"></div>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let uploadType = 'note';
        let selectedFiles = [];

        // Initialize
        async function init() {
            await loadBranches();
            await loadSemesters();
            setupEventListeners();
        }

        // Load branches
        async function loadBranches() {
            try {
                const res = await fetch(`${API_BASE}/api/branches`);
                const data = await res.json();
                const select = document.getElementById('branch');
                data.branches.forEach(branch => {
                    const option = document.createElement('option');
                    option.value = branch;
                    option.textContent = branch;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading branches:', error);
            }
        }

        // Load semesters
        async function loadSemesters() {
            try {
                const res = await fetch(`${API_BASE}/api/semesters`);
                const data = await res.json();
                const select = document.getElementById('semester');
                data.semesters.forEach(sem => {
                    const option = document.createElement('option');
                    option.value = sem;
                    option.textContent = `Semester ${sem}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading semesters:', error);
            }
        }

        // Load subjects when semester changes
        document.getElementById('semester').addEventListener('change', async (e) => {
            const semester = e.target.value;
            if (!semester) return;

            try {
                const res = await fetch(`${API_BASE}/api/subjects?semester=${semester}`);
                const data = await res.json();
                const select = document.getElementById('subject');
                select.innerHTML = '<option value="">Select Subject</option>';
                data.subjects.forEach(subject => {
                    const option = document.createElement('option');
                    option.value = subject;
                    option.textContent = subject.replace(/_/g, ' ');
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading subjects:', error);
            }
        });

        // Setup event listeners
        function setupEventListeners() {
            // Upload type selector
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    uploadType = e.target.dataset.type;
                    document.getElementById('yearGroup').classList.toggle('hidden', uploadType === 'note');
                    document.getElementById('year').required = uploadType === 'pyq';
                    document.getElementById('result').classList.remove('success', 'error');
                    document.getElementById('result').classList.add('hidden');
                });
            });

            // File input
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');

            dropZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);

            // Drag and drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
                addFiles(files);
            });

            // Form submit
            document.getElementById('uploadForm').addEventListener('submit', handleSubmit);
        }

        // Handle file selection
        function handleFileSelect(e) {
            const files = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
            addFiles(files);
        }

        // Add files to list
        function addFiles(files) {
            files.forEach(file => {
                if (!selectedFiles.find(f => f.name === file.name && f.size === file.size)) {
                    selectedFiles.push(file);
                }
            });
            updateFileList();
            updateUploadButton();
        }

        // Remove file
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            updateUploadButton();
        }

        // Update file list display
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${formatFileSize(file.size)}</span>
                    <button type="button" class="remove-btn" onclick="removeFile(${index})">Remove</button>
                `;
                fileList.appendChild(item);
            });
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Update upload button state
        function updateUploadButton() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = selectedFiles.length === 0;
        }

        // Handle form submit
        async function handleSubmit(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('branch', document.getElementById('branch').value);
            formData.append('semester', document.getElementById('semester').value);
            formData.append('subject', document.getElementById('subject').value);
            
            if (uploadType === 'pyq') {
                formData.append('year', document.getElementById('year').value);
            }

            selectedFiles.forEach(file => {
                formData.append('files', file);
            });

            const uploadBtn = document.getElementById('uploadBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const result = document.getElementById('result');

            // Disable button and show progress
            uploadBtn.disabled = true;
            progressBar.classList.add('active');
            result.classList.remove('success', 'error', 'hidden');

            try {
                const endpoint = uploadType === 'note' ? '/api/upload/notes' : '/api/upload/pyqs';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    progressFill.style.width = '100%';
                    progressFill.textContent = '100%';

                    let resultHTML = `
                        <h3>✅ Upload Complete!</h3>
                        <p><strong>Total:</strong> ${data.total} files</p>
                        <p><strong>Successful:</strong> ${data.successful}</p>
                        ${data.failed > 0 ? `<p><strong>Failed:</strong> ${data.failed}</p>` : ''}
                    `;

                    if (data.results && data.results.length > 0) {
                        resultHTML += '<div style="margin-top: 15px;">';
                        data.results.forEach(r => {
                            resultHTML += `
                                <div class="result-item ${r.success ? 'success' : 'error'}">
                                    ${r.success ? '✅' : '❌'} ${r.fileName}
                                    ${r.error ? `<br><small>Error: ${r.error}</small>` : ''}
                                </div>
                            `;
                        });
                        resultHTML += '</div>';
                    }

                    result.innerHTML = resultHTML;
                    result.classList.add('success');
                    result.classList.remove('hidden');

                    // Clear files after successful upload
                    setTimeout(() => {
                        selectedFiles = [];
                        updateFileList();
                        updateUploadButton();
                        document.getElementById('uploadForm').reset();
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                progressBar.classList.remove('active');
                result.innerHTML = `<h3>❌ Upload Failed</h3><p>${error.message}</p>`;
                result.classList.add('error');
                result.classList.remove('hidden');
            } finally {
                uploadBtn.disabled = false;
            }
        }

        // Make removeFile available globally
        window.removeFile = removeFile;

        // Initialize on load
        init();
    </script>
</body>
</html>
